<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    *{box-sizing:border-box}body{width:340px;margin:0;background:#0b1b2a;color:#f0f8f7;font:13px Segoe UI,Arial,sans-serif;padding:20px}
    .brand{font-size:12px;letter-spacing:.12em;color:#70dfce;font-weight:800;text-transform:uppercase}
    h1{font-size:22px;margin:8px 0 5px}.muted{color:#a7bcc9;line-height:1.45}.card{border:1px solid #2d5365;background:#122c3d;border-radius:13px;padding:15px;margin:18px 0}
    .status{font-size:15px;font-weight:800}.ready{color:#78e0bf}.offline{color:#ffb68e}.detail{font-size:12px;color:#a7bdc7;margin-top:8px;overflow-wrap:anywhere}
    button{width:100%;border:0;background:#65d6c3;color:#08202b;border-radius:9px;padding:11px;font-weight:800;cursor:pointer}
    footer{font-size:11px;color:#829eae;text-align:center;margin-top:15px}
  </style>
</head>
<body>
  <div class="brand">◈ OneTech Studio</div>
  <h1>Prompt koruması</h1>
  <div class="muted">AI sitelerinde gönderimden önce yerel maskeleme.</div>
  <div class="card">
    <div id="status" class="status">Bağlantı denetleniyor…</div>
    <div id="detail" class="detail"></div>
  </div>
  <button id="studio">Stüdyoyu aç</button>
  <footer>Yerel servis · 127.0.0.1:8765</footer>
  <script src="popup.js"></script>
</body>
</html>
